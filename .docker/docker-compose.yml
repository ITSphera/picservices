services:
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  image-service:
    container_name: image-service
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../src/.dev.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media:/src/media
      - log_volume:/app/log
    networks:
      - backend

  celery-worker:
    container_name: celery-worker
    build:
      context: ..
      dockerfile: .docker/Dockerfile #use the same dockerfile as the web service.
    restart: always
    command: celery -A src.tasks worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

volumes:
  db_data:
  redis_data:
  log_volume:
  media:

networks:
  backend:
